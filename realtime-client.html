<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health AI - Real-time Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .recording-section {
            text-align: center;
            padding: 40px 20px;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .record-btn.recording {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .record-status {
            font-size: 1.2rem;
            margin: 20px 0;
            color: #666;
        }

        .record-timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        /* Real-time Transcription Display */
        .realtime-transcript {
            background: #f8f9ff;
            border: 2px solid #e0e7ff;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            min-height: 120px;
            position: relative;
        }

        .transcript-label {
            position: absolute;
            top: -12px;
            left: 20px;
            background: white;
            padding: 0 10px;
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
        }

        .transcript-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            min-height: 60px;
        }

        .transcript-placeholder {
            color: #999;
            font-style: italic;
        }

        .confidence-indicator {
            display: flex;
            align-items: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .confidence-bar {
            width: 100px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b 0%, #ffa500 50%, #4ecdc4 100%);
            width: 0%;
            transition: width 0.5s ease;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .risk-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin: 20px 0;
        }

        .risk-high { background: #fee2e2; color: #dc2626; }
        .risk-moderate { background: #fef3c7; color: #f59e0b; }
        .risk-low { background: #d1fae5; color: #10b981; }

        .final-transcript {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .report {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .chart-container {
            margin: 30px 0;
            max-height: 300px;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        /* Audio Visualization */
        .audio-visualizer {
            width: 100%;
            height: 60px;
            background: #f0f0f0;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .visualizer-bar {
            width: 3px;
            background: #667eea;
            margin: 0 1px;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .record-btn {
                width: 100px;
                height: 100px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Mental Health AI</h1>
            <p>Real-time speech analysis with live transcription</p>
        </div>

        <div class="content">
            <div class="recording-section">
                <button id="recordBtn" class="record-btn">🎤</button>
                <div id="recordStatus" class="record-status">Click to start recording</div>
                <div id="recordTimer" class="record-timer">0:00</div>
                
                <!-- Audio Visualizer -->
                <div id="audioVisualizer" class="audio-visualizer" style="display: none;">
                    <!-- Visualizer bars will be added dynamically -->
                </div>

                <!-- Real-time Transcription -->
                <div class="realtime-transcript">
                    <div class="transcript-label">🎤 Live Transcription</div>
                    <div id="realtimeText" class="transcript-text">
                        <span class="transcript-placeholder">Start speaking to see real-time transcription...</span>
                    </div>
                    <div class="confidence-indicator" style="display: none;">
                        <span>Confidence:</span>
                        <div class="confidence-bar">
                            <div id="confidenceFill" class="confidence-fill"></div>
                        </div>
                        <span id="confidenceText">0%</span>
                    </div>
                </div>

                <button id="analyzeBtn" class="btn btn-success" disabled>
                    🧠 Analyze Mental Health
                </button>
                <button id="clearBtn" class="btn btn-secondary">
                    🗑️ Clear & Reset
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Analyzing your speech with AI...</p>
            </div>

            <!-- Results Section -->
            <div id="results" class="results">
                <h3>📊 Analysis Results</h3>
                
                <div class="final-transcript">
                    <h4>📝 Final Transcript</h4>
                    <div id="finalTranscript"></div>
                </div>

                <div id="riskLevel" class="risk-badge"></div>

                <div class="chart-container">
                    <canvas id="predictionChart"></canvas>
                </div>

                <div class="report">
                    <h4>📋 Detailed Report</h4>
                    <div id="reportText"></div>
                </div>
            </div>

            <!-- Error Display -->
            <div id="errorDisplay" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Global variables
        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob;
        let isRecording = false;
        let recordingStartTime;
        let timerInterval;
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let animationId;
        let recognition;
        let finalTranscript = '';
        let interimTranscript = '';

        // DOM elements
        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');
        const recordTimer = document.getElementById('recordTimer');
        const audioVisualizer = document.getElementById('audioVisualizer');
        const realtimeText = document.getElementById('realtimeText');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorDisplay = document.getElementById('errorDisplay');
        const finalTranscriptDiv = document.getElementById('finalTranscript');
        const riskLevel = document.getElementById('riskLevel');
        const reportText = document.getElementById('reportText');
        const confidenceFill = document.getElementById('confidenceFill');
        const confidenceText = document.getElementById('confidenceText');

        // Initialize Web Speech API for real-time transcription
        function initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                
                recognition.onstart = () => {
                    console.log('🎤 Speech recognition started');
                };
                
                recognition.onresult = (event) => {
                    let interim = '';
                    let final = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        const confidence = event.results[i][0].confidence;
                        
                        if (event.results[i].isFinal) {
                            final += transcript + ' ';
                            finalTranscript += transcript + ' ';
                        } else {
                            interim += transcript;
                        }
                        
                        // Update confidence indicator
                        if (confidence) {
                            const confidencePercent = Math.round(confidence * 100);
                            confidenceFill.style.width = confidencePercent + '%';
                            confidenceText.textContent = confidencePercent + '%';
                            document.querySelector('.confidence-indicator').style.display = 'flex';
                        }
                    }
                    
                    // Update real-time display
                    const displayText = (finalTranscript + interim).trim();
                    if (displayText) {
                        realtimeText.innerHTML = displayText;
                        realtimeText.classList.remove('transcript-placeholder');
                    }
                    
                    // Enable analyze button if we have text
                    if (finalTranscript.trim()) {
                        analyzeBtn.disabled = false;
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    if (event.error === 'not-allowed') {
                        showError('Microphone access denied. Please allow microphone access and try again.');
                    }
                };
                
                recognition.onend = () => {
                    console.log('🎤 Speech recognition ended');
                };
                
                return true;
            } else {
                console.warn('Speech Recognition not supported');
                return false;
            }
        }

        // Initialize audio visualizer
        function initializeAudioVisualizer() {
            // Create visualizer bars
            for (let i = 0; i < 50; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '2px';
                audioVisualizer.appendChild(bar);
            }
        }

        // Start audio visualization
        function startVisualization(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            microphone.connect(analyser);
            
            function animate() {
                if (!isRecording) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                const bars = audioVisualizer.querySelectorAll('.visualizer-bar');
                for (let i = 0; i < bars.length; i++) {
                    const barHeight = (dataArray[i] / 255) * 50;
                    bars[i].style.height = Math.max(2, barHeight) + 'px';
                }
                
                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }

        // Record button click handler
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        // Start recording function
        async function startRecording() {
            try {
                // Initialize speech recognition if not done
                if (!recognition) {
                    const speechSupported = initializeSpeechRecognition();
                    if (!speechSupported) {
                        showError('Real-time transcription not supported in this browser. Recording will still work.');
                    }
                }

                // Get microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    } 
                });
                
                // Initialize media recorder
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                    console.log(`✅ Recording complete: ${recordedBlob.size} bytes`);
                };
                
                // Start recording
                mediaRecorder.start(100); // Collect data every 100ms
                isRecording = true;
                
                // Start speech recognition
                if (recognition) {
                    finalTranscript = '';
                    recognition.start();
                }
                
                // Start visualization
                startVisualization(stream);
                audioVisualizer.style.display = 'flex';
                
                // Update UI
                recordBtn.classList.add('recording');
                recordBtn.textContent = '⏹️';
                recordStatus.textContent = 'Recording... Click to stop';
                
                // Start timer
                recordingStartTime = Date.now();
                timerInterval = setInterval(updateTimer, 100);
                
                // Clear previous results
                clearResults();
                
            } catch (error) {
                console.error('Recording error:', error);
                showError('Could not access microphone. Please grant permission and try again.');
            }
        }

        // Stop recording function
        function stopRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            
            // Stop media recorder
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            // Stop speech recognition
            if (recognition) {
                recognition.stop();
            }
            
            // Stop visualization
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            if (audioContext) {
                audioContext.close();
            }
            
            // Stop all tracks
            if (mediaRecorder && mediaRecorder.stream) {
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            
            // Update UI
            recordBtn.classList.remove('recording');
            recordBtn.textContent = '🎤';
            recordStatus.textContent = 'Recording complete! Ready to analyze';
            audioVisualizer.style.display = 'none';
            
            // Stop timer
            clearInterval(timerInterval);
            
            // Enable analyze button if we have transcript
            if (finalTranscript.trim()) {
                analyzeBtn.disabled = false;
            }
        }

        // Update timer display
        function updateTimer() {
            const elapsed = Date.now() - recordingStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            recordTimer.textContent = `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // Analyze button click handler - FIXED TO USE REAL-TIME TRANSCRIPT
        analyzeBtn.addEventListener('click', async () => {
            if (!finalTranscript.trim()) {
                showError('No speech detected. Please record some audio first.');
                return;
            }

            // Use the real-time transcript instead of trying to send audio
            await analyzeTranscript(finalTranscript.trim());
        });

        // Clear button click handler
        clearBtn.addEventListener('click', () => {
            clearResults();
            finalTranscript = '';
            realtimeText.innerHTML = '<span class="transcript-placeholder">Start speaking to see real-time transcription...</span>';
            analyzeBtn.disabled = true;
            recordStatus.textContent = 'Click to start recording';
            recordTimer.textContent = '0:00';
            document.querySelector('.confidence-indicator').style.display = 'none';
        });

        // Analyze transcript function
        async function analyzeTranscript(transcript) {
            try {
                loading.style.display = 'block';
                results.style.display = 'none';
                errorDisplay.style.display = 'none';

                console.log('🧠 Analyzing transcript:', transcript);

                const response = await fetch('/api/text-analysis', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: transcript })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Analysis failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Analysis error:', error);
                showError(`Analysis failed: ${error.message}`);
            } finally {
                loading.style.display = 'none';
            }
        }

        // Display results function
        function displayResults(data) {
            // Final transcript
            finalTranscriptDiv.textContent = data.text || finalTranscript;

            // Risk level
            riskLevel.textContent = `Risk Level: ${data.riskLevel}`;
            riskLevel.className = `risk-badge risk-${data.riskLevel.toLowerCase()}`;

            // Report
            reportText.textContent = data.report;

            // Chart
            const ctx = document.getElementById('predictionChart').getContext('2d');
            
            if (window.predictionChart && typeof window.predictionChart.destroy === 'function') {
                window.predictionChart.destroy();
            }

            window.predictionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.chartData.labels,
                    datasets: [{
                        label: 'Confidence Score (%)',
                        data: data.chartData.scores,
                        backgroundColor: [
                            'rgba(220, 38, 38, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(16, 185, 129, 0.7)'
                        ],
                        borderColor: [
                            'rgb(220, 38, 38)',
                            'rgb(245, 158, 11)',
                            'rgb(16, 185, 129)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: 'Confidence (%)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Mental Health Classification Results'
                        }
                    }
                }
            });

            results.style.display = 'block';
            showSuccess('Analysis complete! Results displayed below.');
        }

        // Utility functions
        function showError(message) {
            errorDisplay.innerHTML = `<div class="error">❌ ${message}</div>`;
            errorDisplay.style.display = 'block';
            setTimeout(() => {
                errorDisplay.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            errorDisplay.innerHTML = `<div class="success">✅ ${message}</div>`;
            errorDisplay.style.display = 'block';
            setTimeout(() => {
                errorDisplay.style.display = 'none';
            }, 3000);
        }

        function clearResults() {
            results.style.display = 'none';
            errorDisplay.style.display = 'none';
            loading.style.display = 'none';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initializeAudioVisualizer();
            console.log('🚀 Mental Health Screening App initialized');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health AI - Fixed Audio Processing</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .recording-section {
            text-align: center;
            padding: 40px 20px;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .record-btn.recording {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .record-status {
            font-size: 1.2rem;
            margin: 20px 0;
            color: #666;
        }

        .record-timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .audio-preview {
            display: none;
            margin: 20px 0;
            text-align: center;
        }

        .audio-preview audio {
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .risk-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin: 20px 0;
        }

        .risk-high { background: #fee2e2; color: #dc2626; }
        .risk-moderate { background: #fef3c7; color: #f59e0b; }
        .risk-low { background: #d1fae5; color: #10b981; }

        .transcript {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .report {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .chart-container {
            margin: 30px 0;
            max-height: 300px;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .info {
            background: #e0f2fe;
            color: #0277bd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .debug-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Mental Health AI</h1>
            <p>Fixed audio processing with proper format conversion</p>
        </div>

        <div class="content">
            <div class="recording-section">
                <button id="recordBtn" class="record-btn">🎤</button>
                <div id="recordStatus" class="record-status">Click to start recording</div>
                <div id="recordTimer" class="record-timer">0:00</div>
                
                <div id="audioPreview" class="audio-preview">
                    <audio id="audioPlayback" controls></audio>
                </div>
                
                <button id="analyzeBtn" class="btn btn-success" disabled>
                    🧠 Analyze Recording
                </button>
            </div>

            <!-- Debug Info -->
            <div id="debugInfo" class="debug-info" style="display: none;"></div>

            <!-- Loading State -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Processing audio with Whisper AI...</p>
            </div>

            <!-- Results Section -->
            <div id="results" class="results">
                <h3>📊 Analysis Results</h3>
                
                <div class="transcript">
                    <h4>📝 Transcript</h4>
                    <div id="transcript"></div>
                </div>

                <div id="riskLevel" class="risk-badge"></div>

                <div class="chart-container">
                    <canvas id="predictionChart"></canvas>
                </div>

                <div class="report">
                    <h4>📋 Detailed Report</h4>
                    <div id="reportText"></div>
                </div>
            </div>

            <!-- Error Display -->
            <div id="errorDisplay" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Global variables
        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob;
        let isRecording = false;
        let recordingStartTime;
        let timerInterval;
        let audioContext;

        // DOM elements
        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');
        const recordTimer = document.getElementById('recordTimer');
        const audioPreview = document.getElementById('audioPreview');
        const audioPlayback = document.getElementById('audioPlayback');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorDisplay = document.getElementById('errorDisplay');
        const debugInfo = document.getElementById('debugInfo');
        const transcript = document.getElementById('transcript');
        const riskLevel = document.getElementById('riskLevel');
        const reportText = document.getElementById('reportText');

        // Record button click handler
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        // Start recording with proper audio configuration
        async function startRecording() {
            try {
                showInfo('🎤 Starting recording with optimized settings...');
                
                // Request microphone with specific constraints for better compatibility
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000,  // Whisper prefers 16kHz
                        channelCount: 1     // Mono audio
                    } 
                });
                
                // Try different MIME types in order of preference
                const mimeTypes = [
                    'audio/wav',
                    'audio/webm;codecs=pcm',
                    'audio/webm;codecs=opus',
                    'audio/webm',
                    'audio/mp4',
                    'audio/ogg;codecs=opus'
                ];
                
                let selectedMimeType = null;
                for (const mimeType of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mimeType)) {
                        selectedMimeType = mimeType;
                        break;
                    }
                }
                
                if (!selectedMimeType) {
                    throw new Error('No supported audio format found');
                }
                
                showDebug(`Selected MIME type: ${selectedMimeType}`);
                
                // Initialize MediaRecorder with the best supported format
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: selectedMimeType,
                    audioBitsPerSecond: 128000  // 128 kbps for good quality
                });
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        showDebug(`Audio chunk: ${event.data.size} bytes`);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    try {
                        // Create blob with the recorded MIME type
                        recordedBlob = new Blob(audioChunks, { type: selectedMimeType });
                        
                        showDebug(`Recording complete:
                        - Size: ${recordedBlob.size} bytes
                        - Type: ${recordedBlob.type}
                        - Chunks: ${audioChunks.length}`);
                        
                        // Validate blob
                        if (recordedBlob.size === 0) {
                            throw new Error('Recording failed: No audio data captured');
                        }
                        
                        if (recordedBlob.size < 1000) {
                            throw new Error('Recording too short: Please record for at least 2 seconds');
                        }
                        
                        if (recordedBlob.size > 25 * 1024 * 1024) {
                            throw new Error('Recording too large: Please keep recordings under 25MB');
                        }
                        
                        // Convert to WAV if possible for better Whisper compatibility
                        if (selectedMimeType !== 'audio/wav') {
                            showInfo('🔄 Converting audio to WAV format for better compatibility...');
                            recordedBlob = await convertToWav(recordedBlob);
                        }
                        
                        // Create audio preview
                        const audioUrl = URL.createObjectURL(recordedBlob);
                        audioPlayback.src = audioUrl;
                        audioPreview.style.display = 'block';
                        analyzeBtn.disabled = false;
                        
                        showSuccess(`✅ Recording ready: ${(recordedBlob.size / 1024).toFixed(2)} KB`);
                        
                    } catch (error) {
                        showError(`Recording processing failed: ${error.message}`);
                    }
                };
                
                mediaRecorder.onerror = (event) => {
                    showError(`Recording error: ${event.error}`);
                };
                
                // Start recording with small time slices for better data collection
                mediaRecorder.start(100);
                isRecording = true;
                
                // Update UI
                recordBtn.classList.add('recording');
                recordBtn.textContent = '⏹️';
                recordStatus.textContent = 'Recording... Click to stop';
                
                // Start timer
                recordingStartTime = Date.now();
                timerInterval = setInterval(updateTimer, 100);
                
                // Clear previous results
                clearResults();
                
            } catch (error) {
                console.error('Recording start error:', error);
                showError(`Could not start recording: ${error.message}`);
            }
        }

        // Stop recording
        function stopRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            
            // Stop media recorder
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            // Stop all tracks
            if (mediaRecorder && mediaRecorder.stream) {
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            
            // Update UI
            recordBtn.classList.remove('recording');
            recordBtn.textContent = '🎤';
            recordStatus.textContent = 'Processing recording...';
            
            // Stop timer
            clearInterval(timerInterval);
        }

        // Convert audio to WAV format for better Whisper compatibility
        async function convertWebMToWav(blob) {
            try {
                showDebug('🔄 Starting WebM to WAV conversion...');
                
                // Create audio context for conversion
                const audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000 // Whisper prefers 16kHz
                });
                
                // Convert blob to array buffer
                const arrayBuffer = await blob.arrayBuffer();
                
                // Decode audio data
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                showDebug(`Decoded audio: ${audioBuffer.duration.toFixed(2)}s, ${audioBuffer.sampleRate}Hz, ${audioBuffer.numberOfChannels} channels`);
                
                // Convert to mono if stereo
                let channelData;
                if (audioBuffer.numberOfChannels > 1) {
                    // Mix down to mono
                    const left = audioBuffer.getChannelData(0);
                    const right = audioBuffer.getChannelData(1);
                    channelData = new Float32Array(left.length);
                    
                    for (let i = 0; i < left.length; i++) {
                        channelData[i] = (left[i] + right[i]) / 2;
                    }
                } else {
                    channelData = audioBuffer.getChannelData(0);
                }
                
                // Convert float32 to int16 for WAV
                const int16Data = new Int16Array(channelData.length);
                for (let i = 0; i < channelData.length; i++) {
                    const sample = Math.max(-1, Math.min(1, channelData[i]));
                    int16Data[i] = sample * 0x7FFF;
                }
                
                // Create WAV file
                const wavBuffer = createWavBuffer(int16Data, audioBuffer.sampleRate);
                const wavBlob = new Blob([wavBuffer], { type: 'audio/wav' });
                
                showDebug(`WAV conversion complete: ${wavBlob.size} bytes`);
                
                // Clean up audio context
                await audioContext.close();
                
                return wavBlob;
                
            } catch (error) {
                showDebug(`WebM to WAV conversion failed: ${error.message}`);
                // Return original blob if conversion fails
                return blob;
            }
        }

        // Create WAV file buffer from PCM data
        function createWavBuffer(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            
            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            
            // PCM data
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(offset, pcmData[i], true);
                offset += 2;
            }
            
            return buffer;
        }

        // Legacy conversion function (fallback)
        async function convertToWav(blob) {
            try {
                // If it's already a WebM, use the proper converter
                if (blob.type.includes('webm')) {
                    return await convertWebMToWav(blob);
                }
                
                // For other formats, just change the MIME type
                const arrayBuffer = await blob.arrayBuffer();
                const wavBlob = new Blob([arrayBuffer], { type: 'audio/wav' });
                
                showDebug(`Simple conversion complete: ${wavBlob.size} bytes`);
                return wavBlob;
                
            } catch (error) {
                showDebug(`Conversion failed, using original: ${error.message}`);
                return blob;
            }
        }

        // Update timer display
        function updateTimer() {
            const elapsed = Date.now() - recordingStartTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            recordTimer.textContent = `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // Analyze button click handler
        analyzeBtn.addEventListener('click', async () => {
            if (!recordedBlob) {
                showError('No recording available. Please record audio first.');
                return;
            }

            await analyzeAudio();
        });

        // Analyze audio with proper error handling
        async function analyzeAudio() {
            try {
                loading.style.display = 'block';
                results.style.display = 'none';
                errorDisplay.style.display = 'none';

                showInfo('🔄 Sending audio to speech-to-text service...');
                
                // Create FormData with proper filename and content type
                const formData = new FormData();
                
                // Generate filename based on blob type
                let filename = 'recording.wav';
                if (recordedBlob.type.includes('webm')) {
                    filename = 'recording.webm';
                } else if (recordedBlob.type.includes('mp4')) {
                    filename = 'recording.mp4';
                } else if (recordedBlob.type.includes('ogg')) {
                    filename = 'recording.ogg';
                }
                
                formData.append('audio', recordedBlob, filename);
                
                showDebug(`Sending to server:
                - Filename: ${filename}
                - Size: ${recordedBlob.size} bytes
                - Type: ${recordedBlob.type}`);

                const response = await fetch('/api/full-analysis', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    
                    // Handle the specific case where Whisper API is unavailable
                    if (response.status === 503 && errorData.alternatives) {
                        showWhisperUnavailableError(errorData);
                        return;
                    }
                    
                    throw new Error(errorData.message || `Server error: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Analysis error:', error);
                showError(`Analysis failed: ${error.message}`);
                
                // Show debug info for troubleshooting
                showDebug(`Error details:
                - Message: ${error.message}
                - Blob size: ${recordedBlob?.size || 'N/A'} bytes
                - Blob type: ${recordedBlob?.type || 'N/A'}`);
                
            } finally {
                loading.style.display = 'none';
            }
        }

        // Show specific error message when Whisper API is unavailable
        function showWhisperUnavailableError(errorData) {
            const alternativesHtml = errorData.alternatives.map(alt => 
                `<div class="alternative-option">
                    <strong>${alt.option}:</strong> ${alt.description}
                    ${alt.url ? `<br><a href="${alt.url}" target="_blank" class="alternative-link">→ Try ${alt.option}</a>` : ''}
                    ${alt.endpoint ? `<br><span class="alternative-endpoint">API: ${alt.endpoint}</span>` : ''}
                </div>`
            ).join('');
            
            errorDisplay.innerHTML = `
                <div class="error">
                    <h3>🚧 Speech-to-Text Service Unavailable</h3>
                    <p>${errorData.message}</p>
                    <div class="alternatives">
                        ${alternativesHtml}
                    </div>
                    <div class="recommendation">
                        <strong>💡 Recommended:</strong> Try the <a href="/realtime-client.html" class="alternative-link">Real-time Transcription</a> 
                        which works directly in your browser!
                    </div>
                </div>
                <style>
                    .alternatives { margin: 15px 0; }
                    .alternative-option { 
                        margin: 10px 0; 
                        padding: 10px; 
                        background: rgba(255,255,255,0.1); 
                        border-radius: 5px; 
                    }
                    .alternative-link { 
                        color: #667eea; 
                        text-decoration: none; 
                        font-weight: bold; 
                    }
                    .alternative-link:hover { text-decoration: underline; }
                    .alternative-endpoint { 
                        font-family: monospace; 
                        font-size: 0.9em; 
                        color: #666; 
                    }
                    .recommendation { 
                        margin-top: 15px; 
                        padding: 10px; 
                        background: rgba(16, 185, 129, 0.1); 
                        border-radius: 5px; 
                        border-left: 4px solid #10b981; 
                    }
                </style>
            `;
            errorDisplay.style.display = 'block';
        }

        // Display results
        function displayResults(data) {
            // Transcript
            transcript.textContent = data.transcript;

            // Risk level
            riskLevel.textContent = `Risk Level: ${data.riskLevel}`;
            riskLevel.className = `risk-badge risk-${data.riskLevel.toLowerCase()}`;

            // Report
            reportText.textContent = data.report;

            // Chart
            const ctx = document.getElementById('predictionChart').getContext('2d');
            
            if (window.predictionChart && typeof window.predictionChart.destroy === 'function') {
                window.predictionChart.destroy();
            }

            window.predictionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.chartData.labels,
                    datasets: [{
                        label: 'Confidence Score (%)',
                        data: data.chartData.scores,
                        backgroundColor: [
                            'rgba(220, 38, 38, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(16, 185, 129, 0.7)'
                        ],
                        borderColor: [
                            'rgb(220, 38, 38)',
                            'rgb(245, 158, 11)',
                            'rgb(16, 185, 129)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: 'Confidence (%)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Mental Health Classification Results'
                        }
                    }
                }
            });

            results.style.display = 'block';
            showSuccess('✅ Analysis complete! Results displayed below.');
        }

        // Utility functions
        function showError(message) {
            errorDisplay.innerHTML = `<div class="error">❌ ${message}</div>`;
            errorDisplay.style.display = 'block';
        }

        function showSuccess(message) {
            errorDisplay.innerHTML = `<div class="success">✅ ${message}</div>`;
            errorDisplay.style.display = 'block';
            setTimeout(() => {
                errorDisplay.style.display = 'none';
            }, 3000);
        }

        function showInfo(message) {
            errorDisplay.innerHTML = `<div class="info">ℹ️ ${message}</div>`;
            errorDisplay.style.display = 'block';
            setTimeout(() => {
                errorDisplay.style.display = 'none';
            }, 3000);
        }

        function showDebug(message) {
            debugInfo.textContent = message;
            debugInfo.style.display = 'block';
            console.log('🔧 Debug:', message);
        }

        function clearResults() {
            results.style.display = 'none';
            errorDisplay.style.display = 'none';
            loading.style.display = 'none';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            showInfo('🎤 Ready to record with optimized audio format handling!');
            console.log('🚀 Fixed Audio Client initialized');
        });
    </script>
</body>
</html>

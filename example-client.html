<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Screening - Voice Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #667eea;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .risk-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin: 20px 0;
        }

        .risk-high { background: #fee2e2; color: #dc2626; }
        .risk-moderate { background: #fef3c7; color: #f59e0b; }
        .risk-low { background: #d1fae5; color: #10b981; }

        .transcript {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .report {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .chart-container {
            margin: 30px 0;
            max-height: 300px;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Mental Health Voice Screening</h1>
        <p class="subtitle">Upload an audio recording for AI-powered mental health analysis</p>

        <div class="upload-area" id="uploadArea">
            <div style="font-size: 48px; margin-bottom: 10px;">🎵</div>
            <p style="font-size: 18px; margin-bottom: 10px;">Drop audio file here or click to browse</p>
            <p style="color: #666; font-size: 14px;">Supported: MP3, WAV, MP4, WebM, OGG, FLAC (max 25MB)</p>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <div id="fileName" style="text-align: center; color: #666; margin-bottom: 10px;"></div>

        <button class="btn" id="analyzeBtn" disabled>Analyze Audio</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your audio...</p>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">This may take 30-60 seconds</p>
        </div>

        <div class="error" id="error" style="display: none;"></div>

        <div class="results" id="results">
            <h2>Analysis Results</h2>
            
            <div class="transcript">
                <strong>📝 Transcript:</strong>
                <p id="transcript" style="margin-top: 10px;"></p>
            </div>

            <div>
                <strong>⚠️ Risk Level:</strong>
                <div class="risk-badge" id="riskBadge"></div>
            </div>

            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>

            <div class="report" id="report"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('audioFile');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            selectedFile = file;
            fileName.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            analyzeBtn.disabled = false;
            results.style.display = 'none';
            errorDiv.style.display = 'none';
        }

        // Analyze button
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('audio', selectedFile);

                const response = await fetch(`${API_URL}/api/full-analysis`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Analysis failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            // Transcript
            document.getElementById('transcript').textContent = data.transcript;

            // Risk level
            const riskBadge = document.getElementById('riskBadge');
            riskBadge.textContent = data.riskLevel;
            riskBadge.className = `risk-badge risk-${data.riskLevel.toLowerCase()}`;

            // Report
            document.getElementById('report').textContent = data.report;

            // Chart
            const ctx = document.getElementById('predictionChart').getContext('2d');
            
            // Destroy previous chart if exists
            if (window.predictionChart) {
                window.predictionChart.destroy();
            }

            window.predictionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.chartData.labels,
                    datasets: [{
                        label: 'Confidence Score (%)',
                        data: data.chartData.scores,
                        backgroundColor: [
                            'rgba(220, 38, 38, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(16, 185, 129, 0.7)'
                        ],
                        borderColor: [
                            'rgb(220, 38, 38)',
                            'rgb(245, 158, 11)',
                            'rgb(16, 185, 129)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: 'Classification Confidence Scores'
                        }
                    }
                }
            });

            results.style.display = 'block';
        }
    </script>
</body>
</html>
